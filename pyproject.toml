[project]
name = "cadence"
version = "0.0.0"
description = "A controller-agnostic platform for network-aware adaptive traffic signal control"
requires-python = ">=3.12,<3.13"
dependencies = [
    "eclipse-sumo==1.27.1",
    "traci==1.27.1",
    "libsumo==1.27.1",
    "sumolib==1.27.1",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "polars>=1.0",
    "typer>=0.12",
]

[project.scripts]
cadence = "cadence.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadence"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
# ruff 0.16 lints and formats Python fences inside Markdown. Every Markdown file in this
# repository is documentation, and its code is illustrative — deliberately not always
# import-clean. Exclude the format rather than enumerating directories.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TID", "ANN", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/Argument are evaluated once at import time and read by Typer's own
# introspection, not mutated per call — the same shape as FastAPI's Depends(), which
# ruff already exempts by default. Without this, every CLI option trips B008.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"traci".msg = "Import the simulator binding through cadence.simulation.sumo.binding (ARCH-D02)."
"libsumo".msg = "Import the simulator binding through cadence.simulation.sumo.binding (ARCH-D02)."
"studies".msg = "Zone A must not import Zone B (PD-D07)."
"sumolib".msg = "Every SUMO surface lives under cadence.simulation.sumo (ST-D12)."

[tool.ruff.lint.per-file-ignores]
"src/cadence/simulation/sumo/binding.py" = ["TID251"]
"src/cadence/simulation/sumo/validation.py" = ["TID251"]
"tests/**" = ["ANN", "TID251"]
"tools/**" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools"]

[[tool.mypy.overrides]]
module = ["traci.*", "libsumo.*", "sumolib.*", "sumo", "polars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"
markers = [
    "sumo: starts a real SUMO process; slower than a unit test",
]
