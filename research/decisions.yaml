# CADENCE Decision Registry
#
# Single source of truth for every decision identifier in this project.
# Referenced from code comments by ID (PD-D06 layer 0.2) and validated by
# the documentation consistency checker (PD-D06 layers 1 and 3).
#
# status:
#   adopted     binding; code may depend on it
#   hypothesis  a research expectation, not a commitment
#   deferred    consciously postponed, with a stated deadline
#   superseded  replaced; see `superseded_by`. Code must not depend on it.
#   retracted   withdrawn; code must not depend on it.
#
# Changing the meaning of an `adopted` entry is prohibited. Issue a new ID,
# mark the old one superseded, and point it at the replacement.
#
# `section_sha` (PD-D06 layer 2) is added at M1, once the research documents
# carry explicit stable anchors.
#
# `used_by` and `enforced_by` are filled in as code is written; the checker
# validates them in both directions.


# ======================================================================
# Project direction (docs/specs/2026-08-22-project-direction.md)
# ======================================================================

PD-D01:
  statement: "CADENCE is a platform; the previous formal title becomes the title of Study 1."
  source:    ../docs/specs/2026-08-22-project-direction.md
  status:    adopted

PD-D02:
  statement: "Milestone ladder M0-M9: contract first, validation controllers before RL, Max-Pressure at the corridor stage."
  source:    ../docs/specs/2026-08-22-project-direction.md
  status:    adopted

PD-D03:
  statement: "Python 3.12, uv, SUMO 1.27.1 via PyPI, ruff, mypy --strict, Pydantic v2, pytest + hypothesis, Stable-Baselines3, YAML configs, Parquet results."
  source:    ../docs/specs/2026-08-22-project-direction.md
  status:    adopted

PD-D04:
  statement: "Unit suffixes on physical quantities, NewType identifiers, versioned semantic identifiers, explicit temporal scope."
  source:    ../docs/specs/2026-08-22-project-direction.md
  status:    adopted

PD-D05:
  statement: "Comments default to none and must fall into PROVENANCE, GOTCHA, DECISION, or CONTRACT."
  source:    ../docs/specs/2026-08-22-project-direction.md
  status:    adopted

PD-D06:
  statement: "Four-layer documentation anti-rot: tests over comments, decision IDs over headings, registry, content hash, bidirectional validation."
