# ======================================================================
# Architecture and controller contract
# ======================================================================

ARCH-D01:
  statement: "The simulation core is controller-agnostic."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

ARCH-D02:
  statement: "Controllers access CADENCE traffic-domain interfaces rather than TraCI directly."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

ARCH-D03:
  statement: "Canonical traffic state is separated from controller observation."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

ARCH-D04:
  statement: "Signal safety/transitions are enforced outside adaptive controller algorithms."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

ARCH-D05:
  statement: "Metrics and experiment KPIs are controller-independent."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

ARCH-D06:
  statement: "RL frameworks are adapters, not the internal shape of CADENCE."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

ARCH-D07:
  statement: "MPC prediction models remain private controller models and never receive future SUMO truth."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

ARCH-D08:
  statement: "Observation fidelity and controller information scope are versioned experiment metadata."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

ARCH-D09:
  statement: "Timeouts and fallback actions are part of the controller contract."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

ARCH-D10:
  statement: "Training and evaluation are separate pipelines sharing the same frozen-controller interface."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

ARCH-D11:
  statement: "MARL/GNN support is extensible but optional."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

ARCH-D12:
  statement: "The repository and APIs should optimize for replacing controllers without modifying simulation semantics."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted


# ======================================================================
# Primary architecture principles (CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md §2)
# ======================================================================

AP-01:
  statement: "Do not optimize an environment we do not trust."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

AP-02:
  statement: "The simulation core must have no dependency on RL-specific concepts such as neural networks, replay buffers, PPO, DQN, or reward optimizers."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

AP-03:
  statement: "Controllers should not directly call traci.lane.* or manipulate raw SUMO traffic-light strings."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

AP-04:
  statement: "Every external adaptive controller uses the same legal signal-transition layer wherever possible."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

AP-05:
  statement: "Controller reward/cost/objective is private to the controller; experiment KPIs are calculated independently."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted

AP-06:
  statement: "Scenario, seed, network, demand, controller config, simulator config, and software versions must be explicit experiment metadata."
  source:    CADENCE_ARCHITECTURE_CONTROLLER_CONTRACT.md
  status:    adopted


# ======================================================================
# Cross-method comparison
# ======================================================================

CM-D01:
  statement: "CADENCE is a controller-agnostic traffic-control experimentation platform."
  source:    CADENCE_CROSS_METHOD_COMPARISON.md
  status:    adopted

CM-D02:
  statement: "SUMO/environment correctness and reproducibility have higher priority than sophisticated control algorithms."
  source:    CADENCE_CROSS_METHOD_COMPARISON.md
  status:    adopted

CM-D03:
  statement: "Initial implementation must support Fixed-Time, Actuated, and external plugin controllers before RL-specific code."
  source:    CADENCE_CROSS_METHOD_COMPARISON.md
  status:    adopted

CM-D04:
  statement: "Controller evaluation must use a shared KPI/event pipeline independent of controller reward/objective."
  source:    CADENCE_CROSS_METHOD_COMPARISON.md
  status:    adopted

CM-D05:
  statement: "Controller information/observation fidelity must be declared explicitly."
  source:    CADENCE_CROSS_METHOD_COMPARISON.md
  status:    adopted

CM-D06:
  statement: "The main network research regime must include oversaturation and physical spillback, not only ordinary traffic."
  source:    CADENCE_CROSS_METHOD_COMPARISON.md
  status:    adopted

CM-D07:
  statement: "Strong claims about RL require comparison with Max-Pressure and a competent predictive/non-learning method where feasible."
  source:    CADENCE_CROSS_METHOD_COMPARISON.md
  status:    adopted

CM-D08:
  statement: "MARL/GNN is deferred until simpler multi-intersection baselines reveal a demonstrated coordination/generalization need."
  source:    CADENCE_CROSS_METHOD_COMPARISON.md
  status:    adopted

CM-D09:
  statement: "No final “best controller” is selected before empirical experiments."
  source:    CADENCE_CROSS_METHOD_COMPARISON.md
  status:    adopted


# ======================================================================
# Traffic engineering and classical/actuated control
# ======================================================================

TC-D01:
  statement: "Evaluate controllers across undersaturated, near-saturated, and oversaturated regimes."
  source:    CADENCE_TRAFFIC_ENGINEERING_RESEARCH.md
  status:    adopted

TC-D02:
  statement: "Validate scenario saturation flow and queue discharge before controller evaluation."
  source:    CADENCE_TRAFFIC_ENGINEERING_RESEARCH.md
  status:    adopted

TC-D03:
  statement: "Oversaturated evaluation must include spillback, queue management, and secondary congestion."
  source:    CADENCE_TRAFFIC_ENGINEERING_RESEARCH.md
  status:    adopted

TC-D04:
  statement: "Fixed-time baseline should be reasonably tuned using established traffic-engineering principles."
  source:    CADENCE_TRAFFIC_ENGINEERING_RESEARCH.md
  status:    superseded
  superseded_by: TC-D09

TC-D05:
  statement: "CADENCE should include SUMO's native gap-based actuated controller as a reproducible classical baseline."
  source:    CADENCE_TRAFFIC_ENGINEERING_RESEARCH.md
  status:    adopted

TC-D06:
  statement: "Actuated-controller parameters should be documented and reasonably tuned rather than relying blindly on defaults."
  source:    CADENCE_TRAFFIC_ENGINEERING_RESEARCH.md
  status:    adopted

TC-D07:
  statement: "Detector placement and detector-related timing parameters must be treated as part of actuated-controller configuration and experiment metadata."
  source:    CADENCE_TRAFFIC_ENGINEERING_RESEARCH.md
  status:    adopted

TC-D08:
  statement: "A controller should not be called network-aware merely because it adapts to local detector demand."
  source:    CADENCE_TRAFFIC_ENGINEERING_RESEARCH.md
  status:    adopted


# ======================================================================
# Max-Pressure / backpressure
# ======================================================================

MP-D01:
  statement: "Treat Max-Pressure as a serious candidate network-aware classical baseline for CADENCE rather than an optional heuristic comparison."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    adopted

MP-D02:
  statement: "Standard downstream queue awareness must not be described as full physical spillback awareness without explicitly modeling finite link storage."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    adopted

MP-D03:
  statement: "Max-Pressure and learned controllers should use the same legal signal-transition/safety layer wherever possible."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    adopted

MP-D04:
  statement: "Any implementation labeled “Original Max-Pressure” must explicitly document how `x(l,m)`, `r(m,p)`, `c(l,m)`, and legal signal stages are represented."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    adopted

MP-D05:
  statement: "Do not interpret theoretical Max-Pressure throughput-optimality as guaranteed minimum delay, waiting time, or best finite-simulation throughput."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    adopted

MP-D06:
  statement: "Substituting lane/edge totals for movement-oriented queues must be treated as a modified formulation rather than silently assumed equivalent."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    adopted

MP-D07:
  statement: "Distinguish local-information control from locally optimized control. Max-Pressure may use local adjacent measurements while encoding downstream network effects."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    adopted

MP-D08:
  statement: "CADENCE must distinguish traffic flow capacity from physical link storage capacity."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    adopted

MP-D09:
  statement: "Controller comparisons should explicitly document observation fidelity; controllers should not receive materially different levels of simulator omniscience without justification."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    adopted

MP-D10:
  statement: "Theoretical guarantees from Original Max-Pressure must not be attributed automatically to modified pressure formulations unless supported by the corresponding theory or literature."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    adopted

MP-D11:
  statement: "A practical network-aware baseline for CADENCE should include at least one state representation that reflects finite downstream storage or physical congestion severity."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    adopted

MP-D12:
  statement: "CADENCE should benchmark one well-defined Original/queue-based Max-Pressure implementation and one justified practical capacity-aware variant rather than attempting to reproduce every Max-Pressure variant."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    adopted

MP-H01:
  statement: "Max-Pressure may provide a strong network-aware baseline without RL training."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    hypothesis

MP-H02:
  statement: "Standard queue-differential pressure may not fully capture finite downstream storage and physical spillback."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    hypothesis

MP-H03:
  statement: "Practical Max-Pressure performance may depend strongly on queue definition, link length, turning ratios, and phase constraints."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    hypothesis

MP-H04:
  statement: "A meaningful CADENCE RL contribution may require improving behavior beyond standard Max-Pressure under realistic network constraints rather than merely outperforming fixed or actuated control."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    hypothesis

MP-H05:
  statement: "Hybrid designs may be more scientifically defensible than pure RL if Max-Pressure provides a strong stability-oriented backbone."
  source:    CADENCE_MAX_PRESSURE_RESEARCH.md
  status:    hypothesis


# ======================================================================
# Optimization and model predictive control
# ======================================================================

MPC-D01:
  statement: "CADENCE should treat SUMO as the experiment environment and an MPC traffic model as an internal controller model; the two must not be assumed equivalent."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    adopted

MPC-D02:
  statement: "MPC should be evaluated partly for its ability to represent traffic and signal constraints explicitly, particularly finite storage and legal control bounds."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    adopted

MPC-D03:
  statement: "Any MPC benchmark should document its prediction model and evaluate sensitivity to model mismatch or demand uncertainty."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    adopted

MPC-D04:
  statement: "Do not benchmark an intentionally weak/toy MPC merely to favor RL."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    adopted

MPC-D05:
  statement: "CADENCE should choose an MPC prediction model based on the traffic phenomenon being evaluated, not on maximum theoretical model detail."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    adopted

MPC-D06:
  statement: "An MPC controller should not be described as predictive spillback control unless its internal model can represent finite receiving/storage constraints and backward congestion effects at the required fidelity."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    adopted

MPC-D07:
  statement: "The first MPC baseline should prefer a tractable link-based/store-and-forward-style model with explicit finite-storage constraints unless experiments show that spatial CTM detail is necessary."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    adopted

MPC-D08:
  statement: "MPC evaluation should report decision/solver latency and controller deadline failures in addition to traffic-performance metrics."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    adopted

MPC-D09:
  statement: "MPC should be evaluated under controlled model/demand mismatch rather than only under perfect prediction assumptions."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    adopted

MPC-D10:
  statement: "Any practical MPC controller should define deterministic fallback behavior for infeasible, missing-state, or solver-timeout conditions."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    adopted

MPC-D11:
  statement: "CADENCE should implement one competent, finite-storage-aware MPC baseline rather than reproducing the full robust/stochastic MPC literature unless MPC itself becomes part of the proposed contribution."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    adopted

MPC-H01:
  statement: "Predictive control may outperform reactive Max-Pressure when congestion can be anticipated before downstream storage is exhausted."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    hypothesis

MPC-H02:
  statement: "MPC's strongest advantages may appear near finite-storage, travel-delay, and coordinated multi-intersection constraints."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    hypothesis

MPC-H03:
  statement: "Model mismatch and computational cost may erase part of MPC's theoretical advantage in realistic networks."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    hypothesis

MPC-H04:
  statement: "A modular CADENCE controller API can support MPC cleanly if the prediction model remains internal to the controller plugin."
  source:    CADENCE_OPTIMIZATION_MPC_RESEARCH.md
  status:    hypothesis


# ======================================================================
# Reinforcement learning for traffic signal control
# ======================================================================

RL-D01:
  statement: "RL is a pluggable controller family, not the architectural center of CADENCE."
  source:    CADENCE_RL_TSC_RESEARCH.md
  status:    adopted

RL-D02:
  statement: "RL actions must pass through the common legal signal safety/constraint layer."
  source:    CADENCE_RL_TSC_RESEARCH.md
  status:    adopted

RL-D03:
  statement: "RL observation fidelity must be explicit and comparable to non-learning baselines."
  source:    CADENCE_RL_TSC_RESEARCH.md
  status:    adopted

RL-D04:
  statement: "Reward is a training signal and must remain separate from experiment KPIs."
  source:    CADENCE_RL_TSC_RESEARCH.md
  status:    adopted

RL-D05:
  statement: "Initial RL evaluation must use held-out traffic scenarios and multiple seeds."
  source:    CADENCE_RL_TSC_RESEARCH.md
  status:    adopted

RL-D06:
  statement: "Competent fixed, actuated, Max-Pressure, and MPC baselines must precede strong claims about RL superiority."
  source:    CADENCE_RL_TSC_RESEARCH.md
  status:    adopted

RL-D07:
  statement: "Use DQN as a discrete-action reference and PPO as the primary generic RL baseline for early CADENCE experiments."
  source:    CADENCE_RL_TSC_RESEARCH.md
  status:    adopted

RL-D08:
  statement: "Do not implement MARL/GNN until the corridor/network experiments demonstrate a coordination problem that simpler controllers do not adequately solve."
  source:    CADENCE_RL_TSC_RESEARCH.md
  status:    adopted


# ======================================================================
# M1a canonical state (docs/specs/2026-08-23-m1a-canonical-state.md)
# ======================================================================

ST-D01:
  statement: "Canonical state and simulation ground truth are two distinct type spaces in two modules; controller-facing code cannot reach the second."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D02:
  statement: "The state/ground-truth separation is enforced by banned-api lint, an import architecture test, and mypy --strict together; no one of them is sufficient."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D03:
  statement: "Canonical state carries only quantities the simulator reports directly; every derived quantity belongs to M1b."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    superseded
  superseded_by: ST-D17

ST-D04:
  statement: "Signal state is a typed enum decoded inside simulation/sumo/; no lamp string leaves that package, including into an artifact."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D05:
  statement: "ConnectionId, the ordered lane pair, is the lowest stable control grain; the TLS link index is recorded but is not an identity."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D06:
  statement: "movement_definition_v1: a MovementId is the ordered edge pair, and a movement groups one or more connections."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D07:
  statement: "Traversal identity is the (incoming lane, outgoing lane) transition, not presence on a via lane."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    superseded
  superseded_by: ST-D16

ST-D08:
  statement: "Run artifacts are partitioned into topology/, state/, and ground_truth/; events.parquet keeps its M0 schema and traversals get a sibling table."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D09:
  statement: "Ground truth is read through an explicitly named method; step() never returns it."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D10:
  statement: "The run manifest records terminal time, step count, and termination reason."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D11:
  statement: "A dirty working tree is hashed into cadence_dirty_digest, not rejected."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D12:
  statement: "All three SUMO surfaces - traci, libsumo, sumolib - live under simulation/sumo/."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D13:
  statement: "s0_turning/v1 is a separate immutable scenario whose network file is byte-identical to s0_single_intersection/v1's by construction."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D14:
  statement: "Canonical traffic state is a controller-parity layer, not a claim of deployment or sensor realism."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted


# ======================================================================
# Oversaturated fixed-time baseline
# (docs/specs/2026-08-24-oversaturated-fixed-time-baseline.md)
# ======================================================================

TC-D09:
  statement: "Webster and HCM critical-flow timing may only initialise an undersaturated or near-saturated fixed-time plan; they are not a valid tuning method at or above saturation."
  source:    ../docs/specs/2026-08-24-oversaturated-fixed-time-baseline.md
  status:    adopted

TC-D10:
  statement: "An oversaturated fixed-time baseline is a frozen, scenario-family-specific queue management plan that documents its bottleneck, storage links, timing, and metering, and states throughput-then-queue-placement as its objective."
  source:    ../docs/specs/2026-08-24-oversaturated-fixed-time-baseline.md
  status:    adopted

TC-D11:
  statement: "Fixed-time plans are calibrated on development scenarios and frozen for held-out evaluation, reporting throughput, residual queue, spillback, junction blocking, and queue location alongside delay."
  source:    ../docs/specs/2026-08-24-oversaturated-fixed-time-baseline.md
  status:    adopted

ST-D15:
  statement: "Canonical state carries a movement layer and the step's traversals, so a controller can estimate turn ratios online without reaching for privileged data."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D16:
  statement: "Traversal identity is the (incoming lane, outgoing edge) transition; the connection is recorded when the exit lane resolves to one and left null when the vehicle changed lane inside the junction."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D17:
  statement: "Canonical state carries only quantities the simulator reports directly; every derived interpretive quantity belongs to M1b, while topology identity and observable traversal are derivations M1a owns."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D18:
  statement: "Post-hoc per-trip evaluation data is not privileged: tripinfo lives in evaluation/, and --tripinfo-output is enabled from M1a."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D19:
  statement: "The run records the signal program definition, the lane a teleport left from, and the cross-tab's unattributed residual, so no question M1b through M9 can ask requires re-running the simulation."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D20:
  statement: "The cross-tab's checkable successor invariant is at the edge, not the lane: a vehicle may occupy a lane its route cannot use, because departure and lane changing place it there before it reaches the stop line."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    superseded
  superseded_by: ST-D21

ST-D21:
  statement: "Checking the cross-tab takes three assertions, not one: reachability at the edge, a bound on off-lane presence, and the off-lane pairs pinned by identity and volume. The edge check alone has no turn resolution where every lane serves a subset of its approach's movements."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D22:
  statement: "The cross-tab's per-lane turn split is unverified at M1a: a permutation confined to the movements one lane serves changes no assertion in the suite, because LaneTurnCount carries no vehicle key and so cannot be reconciled against the traversal stream. M1b must verify it before validating anything against it."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    superseded
  superseded_by: ST-D31

ST-D23:
  statement: "The run directory is a three-way split, not a two-way one: the import ban fences ground_truth/ from code, but state/ and evaluation/ together reconstruct most of it, so an offline loader is bounded by nothing. Whether that is acceptable is M1b's to decide with its first real consumer."
  source:    ../docs/specs/2026-08-23-m1a-canonical-state.md
  status:    adopted

ST-D24:
  statement: "Metrics are computed offline from the run directory alone, so a new metric or a new version of an existing one re-scores every historical run without re-simulating."
  source:    ../docs/specs/2026-08-27-m1b-metrics.md
  status:    adopted

ST-D25:
  statement: "Every metric declares its population, not only its unit: a denominator that is implicit is a metric that cannot be compared."
  source:    ../docs/specs/2026-08-27-m1b-metrics.md
  status:    adopted

ST-D26:
  statement: "Vehicle accounting has two orthogonal axes -- outcome (completed, in network at horizon, never inserted) and incidence (teleports) -- because a teleported vehicle normally completes and teleports are counted per event, not per vehicle."
  source:    ../docs/specs/2026-08-27-m1b-metrics.md
  status:    adopted

ST-D27:
  statement: "A censored quantity is never averaged with an uncensored one: an unfinished trip's duration is how long the clock ran, not its travel time, and pooling the two reintroduces survivor bias."
  source:    ../docs/specs/2026-08-27-m1b-metrics.md
  status:    adopted

ST-D28:
  statement: "A quantity whose unit already includes accumulated time is never time-integrated; a level whose unit does not is integrated with the step length and named for the window. Measured: summing waiting_total_now_s across steps overstates total waiting by sixteen times, while summing halting_count_veh over the same steps agrees with tripinfo to one percent."
  source:    ../docs/specs/2026-08-27-m1b-metrics.md
  status:    adopted

ST-D29:
  statement: "A metric whose support does not exist in the run declares the limitation on its registry entry rather than emitting a confident number, and a metric with no honest definition is deferred rather than approximated."
  source:    ../docs/specs/2026-08-27-m1b-metrics.md
  status:    adopted

ST-D30:
  statement: "The metrics package reads manifest, topology, state and evaluation, and never ground_truth. An oracle metric is legitimate but lives in a separate package with its own allowlist entry, so an oracle is visible from a metric's declared inputs."
  source:    ../docs/specs/2026-08-27-m1b-metrics.md
  status:    adopted

ST-D31:
  statement: "The cross-tab verification splits its deadline: the writer change -- a per-vehicle key reconcilable against the traversal stream -- lands at M1b because every earlier run is otherwise permanently unreconcilable, while the estimator that consumes it moves to M8 with the rest of the turn-ratio work."
  source:    ../docs/specs/2026-08-27-m1b-metrics.md
  status:    adopted

ST-D32:
  statement: "The run records the fleet's vehicle types with their length and minimum gap. Recording is a writer change and lands at M1b for the same reason the cross-tab's does: a run made without it cannot answer a storage question later, which is what ST-D19 promises it can."
  source:    ../docs/specs/2026-08-27-m1b-metrics.md
  status:    adopted

ST-D33:
  statement: "Comparability and reproducibility are different questions over different field sets. Reproducibility asks whether two runs are the same run; comparability asks whether two runs may share a table, under which the controller must differ and the seed usually does."
  source:    ../docs/specs/2026-08-27-m1b-metrics.md
  status:    adopted


# ======================================================================
# M2 — Signal Safety + Controller Contract (docs/specs/2026-09-06-m2-signal-contract.md)
# SIM-D: measured SUMO behaviour (prefix reserved by CADENCE_SUMO_SIMULATION_RESEARCH.md §12)
# ======================================================================

SIM-D01:
  statement: "Under setRedYellowGreenState SUMO switches to a one-phase program named online whose phase lasts a day; getPhase freezes and getSpentDuration resets to a different origin on each call, so neither describes the signal; setProgram returns to the underlying program with its clock intact, as if the override had never happened (measured, SUMO 1.27.1)."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    adopted

SIM-D02:
  statement: "setPhase(i) applies within the same step, restarts the phase clock, and the program continues from i by its own sequencing; setPhaseDuration(d) sets the remaining time once (measured, SUMO 1.27.1)."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    adopted

SIM-D03:
  statement: "libsumo and traci produced identical simulator state under one traffic-light write sequence -- setRedYellowGreenState, setProgram, setPhase, setPhaseDuration -- on one intersection over sixty seconds (measured, SUMO 1.27.1). A hypothesis until a whole controller run compares byte for byte under both bindings."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    hypothesis

SIG-D01:
  statement: "Transitions are the network program's own phases, selected by setPhase; CADENCE never composes a lamp state, so SUMO's online program never occurs and canonical phase_index / phase_elapsed_s stay truthful. Every transition phase a plan needs must exist in the program, and validate-scenario refuses one that lacks it."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    adopted

SIG-D02:
  statement: "The safety envelope (per-stage minimum and maximum green) is scenario data in signal_plan.yaml beside scenario.yaml, hashed into the manifest as a comparability field; it is not controller configuration, because every controller shares it."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    adopted

SIG-D03:
  statement: "A stage is a program phase with at least one permissive signal and no yellow; its PhaseId is its program index and its permitted movements derive from its connections. Transition phases are never stages and can never be requested."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    adopted

SIG-D04:
  statement: "The executor is a pure state machine in control/ that emits SignalCommands as data; exactly one module under simulation/sumo/ applies them. A controller never sees a command."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    adopted

SIG-D05:
  statement: "A stage requested during minimum green or during a transition is deferred and served the first step it is legal; a newer request replaces an older pending one and the replacement is logged; every request, deferral, replacement, transition and forced switch is a row in state/signal_event.parquet, and events.parquet keeps its M0 schema."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    adopted

SIG-D06:
  statement: "At maximum green with no legal request pending the executor transitions to the next stage in program order and records max_green_forced, whatever the controller said; KeepPhase stays legal as the contract's no-op and the mask exposes max_green_reached."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    adopted

SIG-D07:
  statement: "A controller's decision budget is the decision interval by construction. Wall-clock lateness is measured by the runner outside Zone A, recorded per call in controller.json and as a non-reproducible manifest count that verify-run refuses to compare across, and never alters the run or enters a parquet. The only fallback is for an action outside the mask -- a request for a non-stage or for the current stage -- and it is KeepPhase, logged as action_rejected."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    adopted

SIG-D08:
  statement: "controller_id = none bypasses the safety layer entirely and its output is byte-identical to pre-M2 runs over the M1 artifact set; the fixed-time test controller that replays the static program through the executor must match it byte for byte over that set, at a decision interval that divides every program switch and under an envelope that brackets each stage's duration -- the milestone's acceptance test."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    adopted

SIG-D09:
  statement: "ControllerAction v1 is KeepPhase | RequestPhase(PhaseId), versioned controller_action:v1; KeepPhase is the no-op, RequestNextPhase is a call-site derivation, and ExtendPhase and SetGreenSplit are not v1."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    adopted

SIG-D10:
  statement: "The decision interval is run metadata: decision_interval_s, a multiple of step_length_s, recorded in the manifest as a comparability field; controllers are called only at interval boundaries and the executor runs every step."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    adopted

SIG-D11:
  statement: "Controller configuration is hashed into controller_config_sha256, a controller-identity manifest field (so two configurations of one controller are a controller comparison), and written to controller.json in the run directory."
  source:    ../docs/specs/2026-09-06-m2-signal-contract.md
  status:    adopted
