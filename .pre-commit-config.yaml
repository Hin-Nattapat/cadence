repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: architecture
        name: architecture boundaries
        entry: uv run pytest tests/test_architecture.py -q
        language: system
        pass_filenames: false
        types: [python]
      - id: decisions
        name: decision registry
        entry: uv run python tools/check_decisions.py
        language: system
        pass_filenames: false
